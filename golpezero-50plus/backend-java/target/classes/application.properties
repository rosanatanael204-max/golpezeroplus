# Servidor

# Configuração do Serviço de IA
ai.service.url=http://localhost:5000

# (Caso a tua AnaliseService também utilize chave de API)
ai.service.api-key=0292
server.port=8080

# Configuração da Base de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/golpezero
spring.datasource.username=postgres
